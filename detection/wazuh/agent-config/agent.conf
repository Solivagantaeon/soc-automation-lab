<agent_config>
    <!-- Shared agent configuration here -->
  </agent_config>
  <!--
  Wazuh 4.14 – central configuration for Windows agents: reducing registry FIM noise
  Why on the agent side and not with rules:
    the local ossec.conf monitors the WHOLE HKLM\System\CurrentControlSet\Services, which produces
    ~170 FIM alerts per 12-hour scan (01:04 WIN-01: 49, 01:19 WIN11: 99,
    01:32 DC: 22). registry_ignore drops the events at the source, so they do not clog
    the queue or the index.
  Basis: keys whose LastWriteTime changed between scans on SOC-WIN11-AI.
  Everything below is system state/cache, not configuration:
-->
  <agent_config os="Windows">
    <syscheck>
      <!-- BAM: last-run timestamp of every program, per user -->
      <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\bam\State\UserSettings</registry_ignore>
      <!-- Time sync: LastKnownGoodTime/status and limits, written on every sync -->
      <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\W32Time\Config</registry_ignore>
      <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\W32Time\SecureTimeLimits</registry_ignore>
      <!-- TPM certificate cache (EK/Intermediate CA) -->
      <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\TPM\WMI</registry_ignore>
      <!-- Device Setup Manager – state -->
      <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\DsmSvc\State</registry_ignore>
      <!-- Firewall change counter (the FirewallRules themselves are STILL monitored) -->
      <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\SharedAccess\Epoch</registry_ignore>
      <!-- Volatile user session key (changes on every logon) -->
      <registry_ignore arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\VolatileUserMgrKey</registry_ignore>
      <!-- Network stack bindings (Linkage, Parameters\Adapters) – rebuilt when a NIC/RAS adapter changes.
         Same mechanism as the default "\Enum$" (sregex = match on the end of the path). -->
      <registry_ignore type="sregex">\Linkage$</registry_ignore>
      <registry_ignore type="sregex">\Parameters\Adapters$</registry_ignore>
    </syscheck>
    <!-- Sysmon: channel collected centrally for all Windows agents -->
    <localfile>
      <location>Microsoft-Windows-Sysmon/Operational</location>
      <log_format>eventchannel</log_format>
    </localfile>
  </agent_config>
  <!--
  INTENTIONALLY NOT ignored (a change = potential tampering/persistence):
    Services\<service>\ImagePath, \Start, \Security; Services\SysmonDrv\Parameters;
    Services\SharedAccess\...\FirewallRules; Software\Policies\Microsoft\Windows Defender;
    Run/RunOnce; Active Setup\Installed Components; Winlogon (except VolatileUserMgrKey).
  Per-user services (CDPUserSvc_xxxxx etc.) are silenced by rule 100185 in local_rules –
  registry_ignore (sregex) does not support patterns like "_[hex]".
-->