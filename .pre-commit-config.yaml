# Install once:  pre-commit install --hook-type pre-commit --hook-type pre-push
# These hooks only run for commits made with git on your computer. Files uploaded through the
# GitHub web page skip them - check such files by hand first (see SECURITY.md).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-json
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.(ps1|bat)$'

  - repo: local
    hooks:
      - id: leak-check
        name: secrets & personal data (sanitize_export.py --check)
        entry: python scripts/sanitize_export.py --check
        language: python
        types: [text]
        exclude: '^tests/fixtures/'

      - id: image-check
        name: screenshots - metadata & visible text (check_images.py)
        entry: python scripts/check_images.py --ocr
        language: python
        additional_dependencies: [pillow]
        types: [image]

      - id: leak-check-commits
        name: secrets & personal data in every commit being pushed
        entry: python scripts/sanitize_export.py --check-commits origin/main..HEAD
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]
